<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- The Small Print — Logo Icon (Dark) -->
  <rect width="500" height="500" rx="80" fill="#1e2d3d"/>

  <!-- S — large, cream -->
  <text
    x="250"
    y="210"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="212"
    fill="#f2ede4"
  >S</text>

  <!-- THE — small, centered, very subtle -->
  <text
    x="250"
    y="318"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    fill="#f2ede4"
    opacity="0.35"
    letter-spacing="8"
  >THE</text>

  <!-- P — smaller, teal -->
  <text
    x="250"
    y="408"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="100"
    fill="#14919B"
  >P</text>
</svg>
